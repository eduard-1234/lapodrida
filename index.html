/* ─────────────────────────────────────────────
   LA PODRIDA — marcador de punts
   ───────────────────────────────────────────── */

const C = {
  bg: "#14291F", bg2: "#1D3529", felt: "#2A4636",
  cream: "#F6EDDC", cream2: "#EFE2C8", ink: "#2B241C",

/* Utilitats */
const uid = () => Math.random().toString(36).slice(2, 9);
const maxCards = (n) => Math.floor(48 / n);
const roundSeq = (n) => {
  const m = maxCards(n);
  const up = Array.from({ length: m }, (_, i) => i + 1);
  const down = Array.from({ length: m - 1 }, (_, i) => m - 1 - i);
  return [...up, ...down];
};
const fmtDate = (iso) => {
  const d = new Date(iso);
  return d.toLocaleDateString("ca-ES", { day: "numeric", month: "short", year: "numeric" }) +
    " · " + d.toLocaleTimeString("ca-ES", { hour: "2-digit", minute: "2-digit" });
};
/* Durada com a cronòmetre (h:mm:ss) i com a text (1 h 23 min) */
const fmtClock = (ms) => {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  const pad = (x) => String(x).padStart(2, "0");
  return h > 0 ? `${h}:${pad(m)}:${pad(ss)}` : `${m}:${pad(ss)}`;
};
const fmtDur = (ms) => {
  if (!ms) return null;
  const min = Math.round(ms / 60000);
  if (min < 1) return "menys d'1 min";
  const h = Math.floor(min / 60), m = min % 60;
  return h > 0 ? `${h} h ${m} min` : `${m} min`;
};

/* ── Persistència amb IndexedDB ── */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("lapodrida", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction("kv").objectStore("kv").get(k);
    t.onsuccess = () => res(t.result);
    t.onerror = () => rej(t.error);
  });
}
async function kvSet(k, v) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction("kv", "readwrite").objectStore("kv").put(v, k);
    t.onsuccess = () => res();
    t.onerror = () => rej(t.error);
  });
}

/* Redueix les fotos abans de guardar-les (estalvia molt d'espai) */
function shrink(dataUrl, max = 800) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      if (s >= 1) return res(dataUrl);
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * s);
      cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      res(cv.toDataURL("image/jpeg", 0.82));
    };
    img.src = dataUrl;
  });
}

/* Input de foto (càmera o galeria) */

/* ── Filtres de guanyador/perdedor ── */
function Stickers({ mode }) {
  return (
    <svg viewBox="0 0 100 100" preserveAspectRatio="none"
      style={{ position: "absolute", inset: 0, width: "100%", height: "100%", pointerEvents: "none" }}>
      <ellipse cx="50" cy="47" rx="21" ry="28" fill="none" stroke="rgba(255,255,255,.55)"
        strokeWidth="0.7" strokeDasharray="2.5 2.5" />
      {mode === "winner" ? (
        <text x="50" y="19" textAnchor="middle" fontSize="24">👑</text>
      ) : (
        <>
          <text x="39" y="56" textAnchor="middle" fontSize="9">💧</text>
          <text x="61" y="56" textAnchor="middle" fontSize="9">💧</text>
          <text x="36" y="64" textAnchor="middle" fontSize="6">💧</text>
          <text x="64" y="64" textAnchor="middle" fontSize="6">💧</text>
        </>
      )}
    </svg>
  );
}

function drawStickers(ctx, w, h, mode) {
  const X = (f) => (f / 100) * w;
  const Y = (f) => (f / 100) * h;
  ctx.textAlign = "center";
  if (mode === "winner") {
    ctx.font = `${X(26)}px serif`;
    ctx.fillText("👑", X(50), Y(21));
  } else {
    ctx.font = `${X(9)}px serif`;
    ctx.fillText("💧", X(39), Y(56)); ctx.fillText("💧", X(61), Y(56));
    ctx.font = `${X(6)}px serif`;
    ctx.fillText("💧", X(36), Y(64)); ctx.fillText("💧", X(64), Y(64));
  }
}

function FilterCam({ mode, onDone, onClose }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const fileRef = useRef(null);
  const [live, setLive] = useState(false);
  const [err, setErr] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }, audio: false,
        });
        if (cancelled) { stream.getTracks().forEach((t) => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play();
        }
        setLive(true);
      } catch {
        setErr(true);
      }
    })();
    return () => {
      cancelled = true;
      streamRef.current?.getTracks().forEach((t) => t.stop());
    };
  }, []);

  const capture = async () => {
    const v = videoRef.current;
    if (!v) return;
    const cv = document.createElement("canvas");
    cv.width = v.videoWidth; cv.height = v.videoHeight;
    const ctx = cv.getContext("2d");
    ctx.translate(cv.width, 0); ctx.scale(-1, 1);
    ctx.drawImage(v, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawStickers(ctx, cv.width, cv.height, mode);
    onDone(await shrink(cv.toDataURL("image/jpeg", 0.85)));
  };

  const fromFile = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = async () => {
        const cv = document.createElement("canvas");
        cv.width = img.width; cv.height = img.height;
        const ctx = cv.getContext("2d");
        ctx.drawImage(img, 0, 0);
        drawStickers(ctx, cv.width, cv.height, mode);
        onDone(await shrink(cv.toDataURL("image/jpeg", 0.85)));
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };

  const title = mode === "winner" ? "Foto del guanyador 🥇" : "Foto del perdedor 💀";

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,.88)", zIndex: 20,
      display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 16,
    }}>
      <h2 style={{ fontFamily: font.display, color: C.cream, margin: "0 0 12px", fontSize: 20 }}>{title}</h2>
      <div style={{
        position: "relative", width: "100%", maxWidth: 340, aspectRatio: "3/4",
        borderRadius: 18, overflow: "hidden", background: "#000",
        border: `3px solid ${mode === "winner" ? C.gold : C.red}`,
      }}>
        <video ref={videoRef} playsInline muted
          style={{ width: "100%", height: "100%", objectFit: "cover", transform: "scaleX(-1)" }} />
        <Stickers mode={mode} />
        {!live && !err && (
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center",
            justifyContent: "center", color: C.mut, fontWeight: 700 }}>Obrint càmera…</div>
        )}
        {err && (
          <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "center", gap: 12, padding: 20, textAlign: "center" }}>
            <p style={{ color: C.cream, fontWeight: 700, margin: 0, fontSize: 14 }}>
              La càmera en viu no està disponible. Fes la foto amb la càmera normal i
              el filtre s'hi aplicarà automàticament.
            </p>
            <input ref={fileRef} type="file" accept="image/*" capture="user"
              style={{ display: "none" }} onChange={fromFile} />
            <button onClick={() => fileRef.current?.click()} style={{
              padding: "12px 20px", borderRadius: 12, border: "none", background: C.gold,
              color: C.ink, fontFamily: font.display, fontSize: 15, cursor: "pointer",
            }}>📷 Fer foto</button>
          </div>
        )}
      </div>
      <p style={{ color: C.mut, fontWeight: 700, fontSize: 13, margin: "10px 0 14px" }}>
        Alinea la cara amb l'oval puntejat
      </p>
      <div style={{ display: "flex", gap: 12 }}>
        <button onClick={onClose} style={{
          padding: "12px 20px", borderRadius: 12, border: `2px solid ${C.mut}`, background: "none",
          color: C.cream, fontWeight: 800, cursor: "pointer",
        }}>Cancel·lar</button>
        {live && (
          <button onClick={capture} style={{
            padding: "12px 28px", borderRadius: 12, border: "none", background: C.red,
            color: C.cream, fontFamily: font.display, fontSize: 16, cursor: "pointer",
          }}>📸 Capturar</button>
        )}
      </div>
    </div>
  );
}

function LaPodrida() {
  const [profiles, setProfiles] = useState([]);
  const [games, setGames] = useState([]);
  const [ready, setReady] = useState(false);

  const [view, setView] = useState("home");
  const [detailId, setDetailId] = useState(null);

  const [npName, setNpName] = useState("");
  const [npPhoto, setNpPhoto] = useState(null);

  const [order, setOrder] = useState([]);

  const [game, setGame] = useState(null);
  const [showRank, setShowRank] = useState(false);
  const [confirmEnd, setConfirmEnd] = useState(false);
  const [missFor, setMissFor] = useState(null);
  const [finWinner, setFinWinner] = useState(null);
  const [finLoser, setFinLoser] = useState(null);
  const [camFor, setCamFor] = useState(null);
  const [lightbox, setLightbox] = useState(null);   // foto ampliada
  const [gameDetail, setGameDetail] = useState(null); // partida amb puntuació completa oberta
  const [confirmDel, setConfirmDel] = useState(null); // id de partida a eliminar
  const [liarAlert, setLiarAlert] = useState(false);  // "algú ha mentit!"
  const [tiebreak, setTiebreak] = useState(null);     // desempat a cara o creu
  const [showRounds, setShowRounds] = useState(false); // detall per rondes al final
  const [detailPl, setDetailPl] = useState(null);      // jugador seleccionat al detall
  const [, setTick] = useState(0);                     // refresc del cronòmetre

  /* Cronòmetre: refresca cada segon mentre hi ha partida en marxa */
  useEffect(() => {
    if (view !== "game") return;
    const t = setInterval(() => setTick((x) => x + 1), 1000);
    return () => clearInterval(t);
  }, [view]);

  /* Càrrega inicial des d'IndexedDB */
  useEffect(() => {
    (async () => {
      try {
        const p = await kvGet("profiles");
        const gs = await kvGet("games");
        const cur = await kvGet("game");
        if (p) setProfiles(p);
        if (gs) setGames(gs);
        if (cur) {
          setGame(cur);
          if (cur.phase === "done") {
            const top = Math.max(...Object.values(cur.scores));
            const tied = cur.playerIds.filter((id) => cur.scores[id] === top);
            if (tied.length > 1 && !cur.tbWinner) {
              setTiebreak({ queue: tied, choice: null, flipping: false, result: null });
              setView("tiebreak");
            } else setView("finish");
          } else setView("game");
        }
      } catch (e) { console.error(e); }
      setReady(true);
    })();
  }, []);

  /* Guardar automàticament cada canvi */
  useEffect(() => { if (ready) kvSet("profiles", profiles); }, [profiles, ready]);
  useEffect(() => { if (ready) kvSet("games", games); }, [games, ready]);
  useEffect(() => { if (ready) kvSet("game", game); }, [game, ready]);

  const byId = (id) => profiles.find((p) => p.id === id);

  const statsOf = (id) => {
    const played = games.filter((g) => g.players.some((p) => p.profileId === id));
    const pts = played.map((g) => g.players.find((p) => p.profileId === id).points);
    const firsts = played.filter((g) => g.winnerId === id).length;
    const lasts = played.filter((g) => g.loserId === id).length;
    return {
      played: played.length,
      max: pts.length ? Math.max(...pts) : null,
      min: pts.length ? Math.min(...pts) : null,
      firsts, lasts,
    };
  };

  const startGame = () => {
    const seq = roundSeq(order.length);
    setGame({
      playerIds: [...order], seq, round: 0, phase: "bets",
      bets: {}, turn: 0,
      startedAt: Date.now(), history: [],
      scores: Object.fromEntries(order.map((id) => [id, 0])),
    });
    setView("game");
  };

  const g = game;
  const N = g ? g.playerIds.length : 0;
  const cards = g ? g.seq[g.round] : 0;
  const dealerIdx = g ? g.round % N : 0;
  const betOrder = g
    ? Array.from({ length: N }, (_, i) => g.playerIds[(dealerIdx + 1 + i) % N])
    : [];
  const currentId = g ? betOrder[g.turn] : null;
  const sumBets = g ? Object.values(g.bets).reduce((a, b) => a + b, 0) : 0;
  const isLastBettor = g && g.turn === N - 1;
  const forbiddenN = isLastBettor ? cards - sumBets : -1;

  const placeBet = (n) => {
    const bets = { ...g.bets, [currentId]: n };
    if (g.turn + 1 < N) setGame({ ...g, bets, turn: g.turn + 1 });
    else setGame({ ...g, bets, phase: "play" });
  };

  const startResults = () => setGame({ ...g, phase: "results", turn: 0, results: {} });

  /* Tanca la partida: detecta empat al capdavant → desempat a cara o creu */
  const finishGame = (base) => {
    const top = Math.max(...Object.values(base.scores));
    const tied = base.playerIds.filter((id) => base.scores[id] === top);
    setFinWinner(null); setFinLoser(null);
    setGame({ ...base, phase: "done" });
    if (tied.length > 1) {
      setTiebreak({ queue: tied, choice: null, flipping: false, result: null });
      setView("tiebreak");
    } else {
      setView("finish");
    }
  };

  const applyResult = (id, delta, hit) => {
    const results = { ...(g.results || {}), [id]: { delta, hit } };
    const scores = { ...g.scores, [id]: g.scores[id] + delta };
    setMissFor(null);
    if (g.turn + 1 < N) {
      setGame({ ...g, scores, results, turn: g.turn + 1 });
      return;
    }
    /* Últim jugador: si tots han "encertat", és impossible (la suma
       d'apostes mai quadra amb les bases) → algú ha mentit */
    if (Object.values(results).every((r) => r.hit)) {
      const reverted = { ...g.scores };
      Object.entries(g.results || {}).forEach(([pid, r]) => { reverted[pid] -= r.delta; });
      setGame({ ...g, scores: reverted, results: {}, turn: 0 });
      setLiarAlert(true);
      return;
    }
    /* Ronda completada: es guarda al detall per rondes */
    const newHistory = [...(g.history || []), {
      cards,
      entries: betOrder.map((pid) => ({
        id: pid, bet: g.bets[pid],
        hit: results[pid].hit, delta: results[pid].delta,
      })),
    }];
    if (g.round + 1 < g.seq.length) {
      const peak = Math.max(...g.seq);
      /* Si s'acaba la ronda màxima i la següent ja baixa → preguntar si es repeteix */
      if (g.seq[g.round] === peak && g.seq[g.round + 1] < peak) {
        setGame({ ...g, scores, results: {}, history: newHistory, phase: "askRepeat" });
      } else {
        setGame({ ...g, scores, results: {}, history: newHistory, round: g.round + 1, phase: "bets", bets: {}, turn: 0 });
      }
    } else {
      finishGame({ ...g, scores, results: {}, history: newHistory });
    }
  };

  const undoResult = () => {
    const prev = betOrder[g.turn - 1];
    const r = (g.results || {})[prev];
    if (!r) return;
    const scores = { ...g.scores, [prev]: g.scores[prev] - r.delta };
    const results = { ...g.results };
    delete results[prev];
    setMissFor(null);
    setGame({ ...g, scores, results, turn: g.turn - 1 });
  };

  const ranking = g
    ? [...g.playerIds].sort((a, b) => g.scores[b] - g.scores[a])
    : [];

  const saveGame = () => {
    const winnerId = g.tbWinner || ranking[0];
    const loserId = ranking[ranking.length - 1];
    setGames([
      {
        id: uid(), date: new Date().toISOString(),
        players: g.playerIds.map((id) => ({ profileId: id, points: g.scores[id] })),
        winnerId, loserId,
        winnerPhoto: finWinner, loserPhoto: finLoser,
        durationMs: g.startedAt ? Date.now() - g.startedAt : null,
        tiebreak: !!g.tbWinner,
        history: g.history || [],
      },
      ...games,
    ]);
    setGame(null);
    setView("history");
  };

  if (!ready) {
    return (
      <div style={{ minHeight: "100vh", background: C.bg, display: "flex",
        alignItems: "center", justifyContent: "center", color: C.mut,
        fontFamily: font.body, fontWeight: 700 }}>Carregant…</div>
    );
  }

  /* ═══════════ PANTALLES ═══════════ */

  if (view === "home") {
    return (
      <Shell title="">
        <div style={{ textAlign: "center", margin: "30px 0 40px" }}>
          <div style={{ fontSize: 44 }}>🃏</div>
          <h1 style={{ fontFamily: font.display, fontSize: 40, margin: "6px 0 2px", color: C.cream }}>
            La <span style={{ color: C.gold }}>Podrida</span>
          </h1>
          <p style={{ color: C.mut, margin: 0, fontWeight: 700 }}>Marcador de punts</p>
        </div>
        <div style={{ display: "grid", gap: 14 }}>
          <BigBtn accent onClick={() => { setOrder([]); setView("setup"); }}>▶ Partida nova</BigBtn>
          <BigBtn onClick={() => setView("history")}>🏆 Partides anteriors</BigBtn>
          <BigBtn onClick={() => setView("profiles")}>👤 Perfils</BigBtn>
        </div>
        <p style={{
          color: C.mut, fontSize: 12, fontWeight: 700, textAlign: "center",
          marginTop: 40, letterSpacing: 0.5,
        }}>Created by <span style={{ color: C.goldSoft }}>Eduard Agustí</span></p>
      </Shell>
    );
  }

  if (view === "profiles") {
    return (
      <Shell title="Perfils" back={() => setView("home")}>
        <BigBtn accent onClick={() => { setNpName(""); setNpPhoto(null); setView("newProfile"); }}>
          + Crear nou perfil
        </BigBtn>
        <div style={{ display: "grid", gap: 10, marginTop: 18 }}>
          {profiles.length === 0 && (
            <p style={{ color: C.mut, textAlign: "center" }}>Encara no hi ha cap perfil. Crea el primer!</p>
          )}
          {profiles.map((p) => (
            <button key={p.id}
              onClick={() => { setDetailId(p.id); setView("profileDetail"); }}
              style={{
                display: "flex", alignItems: "center", gap: 12, padding: 12,
                background: C.bg2, border: `1px solid ${C.felt}`, borderRadius: 14,
                color: C.cream, cursor: "pointer", textAlign: "left",
              }}>
              <Avatar profile={p} />
              <span style={{ fontWeight: 800, fontSize: 17, flex: 1 }}>{p.name}</span>
              <span style={{ color: C.mut }}>›</span>
            </button>
          ))}
        </div>
      </Shell>
    );
  }

  if (view === "newProfile") {
    return (
      <Shell title="Nou perfil" back={() => setView("profiles")}>
        <div style={{ display: "grid", gap: 20, justifyItems: "center", marginTop: 10 }}>
          <PhotoButton label="Afegir foto" photo={npPhoto} onPhoto={setNpPhoto} big />
          <input
            value={npName}
            onChange={(e) => setNpName(e.target.value)}
            placeholder="Nom d'usuari"
            style={{
              width: "100%", padding: "14px 16px", borderRadius: 12, border: `2px solid ${C.felt}`,
              background: C.cream, color: C.ink, fontSize: 17, fontWeight: 700, fontFamily: font.body,
              boxSizing: "border-box",
            }}
          />
          <div style={{ width: "100%" }}>
            <BigBtn accent onClick={() => {
              if (!npName.trim()) return;
              setProfiles([...profiles, { id: uid(), name: npName.trim(), photo: npPhoto }]);
              setView("profiles");
            }}>Guardar perfil</BigBtn>
          </div>
        </div>
      </Shell>
    );
  }

  if (view === "profileDetail") {
    const p = byId(detailId);
    if (!p) { setView("profiles"); return null; }
    const s = statsOf(p.id);
    const Stat = ({ label, value }) => (
      <div style={{ background: C.bg2, borderRadius: 14, padding: "14px 10px", textAlign: "center", border: `1px solid ${C.felt}` }}>
        <div style={{ fontFamily: font.display, fontSize: 26, color: C.gold }}>{value ?? "—"}</div>
        <div style={{ color: C.mut, fontSize: 12, fontWeight: 700 }}>{label}</div>
      </div>
    );
    return (
      <Shell title={p.name} back={() => setView("profiles")}>
        <div style={{ display: "flex", justifyContent: "center", margin: "6px 0 22px" }}>
          <button onClick={() => p.photo && setLightbox(p.photo)} style={{
            background: "none", border: "none", padding: 0,
            cursor: p.photo ? "pointer" : "default",
          }}>
            <Avatar profile={p} size={110} />
          </button>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Stat label="Partides jugades" value={s.played} />
          <Stat label="Cops 1r 🥇" value={s.firsts} />
          <Stat label="Màxim de punts" value={s.max} />
          <Stat label="Mínim de punts" value={s.min} />
          <Stat label="Cops últim 💀" value={s.lasts} />
        </div>
        <Lightbox src={lightbox} onClose={() => setLightbox(null)} />
      </Shell>
    );
  }

  if (view === "setup") {
    const toggle = (id) =>
      setOrder(order.includes(id) ? order.filter((x) => x !== id) : [...order, id]);
    return (
      <Shell title="Partida nova" back={() => setView("home")}>
        <p style={{ color: C.mut, fontWeight: 700, marginTop: 0 }}>
          Toca els jugadors <b style={{ color: C.goldSoft }}>en ordre d'asseguda</b> (el 1r reparteix la primera ronda).
        </p>
        {profiles.length < 2 && (
          <p style={{ color: C.goldSoft }}>Necessites com a mínim 2 perfils. Ves a Perfils i crea'ls primer.</p>
        )}
        <div style={{ display: "grid", gap: 10 }}>
          {profiles.map((p) => {
            const pos = order.indexOf(p.id);
            const sel = pos >= 0;
            return (
              <button key={p.id} onClick={() => toggle(p.id)}
                style={{
                  display: "flex", alignItems: "center", gap: 12, padding: 12,
                  background: sel ? C.felt : C.bg2, borderRadius: 14, color: C.cream,
                  border: `2px solid ${sel ? C.gold : C.felt}`, cursor: "pointer", textAlign: "left",
                }}>
                <Avatar profile={p} ring={sel ? C.gold : C.mut} />
                <span style={{ fontWeight: 800, fontSize: 16, flex: 1 }}>{p.name}</span>
                {sel && (
                  <span style={{
                    fontFamily: font.display, background: C.gold, color: C.ink,
                    borderRadius: "50%", width: 30, height: 30, display: "flex",
                    alignItems: "center", justifyContent: "center",
                  }}>{pos + 1}</span>
                )}
              </button>
            );
          })}
        </div>
        {order.length >= 2 && (
          <div style={{ marginTop: 18, display: "grid", gap: 12 }}>
            <p style={{ color: C.mut, textAlign: "center", margin: 0, fontWeight: 700 }}>
              {order.length} jugadors · fins a {maxCards(order.length)} cartes · {roundSeq(order.length).length} rondes
            </p>
            <BigBtn accent onClick={startGame}>Començar partida</BigBtn>
          </div>
        )}
      </Shell>
    );
  }

  if (view === "game" && g) {
    const cur = byId(currentId);
    const dealer = byId(g.playerIds[dealerIdx]);
    const header = (
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={() => setShowRank(true)} style={{
          background: C.gold, border: "none", borderRadius: 10, padding: "8px 12px",
          fontFamily: font.display, color: C.ink, fontSize: 13, cursor: "pointer",
        }}>Puntuació</button>
        <button onClick={() => setConfirmEnd(true)} style={{
          background: "none", border: `1.5px solid ${C.red}`, borderRadius: 10, padding: "8px 12px",
          fontFamily: font.display, color: "#E07B72", fontSize: 13, cursor: "pointer",
        }}>Finalitzar</button>
      </div>
    );

    return (
      <Shell title={`Ronda ${g.round + 1}/${g.seq.length}`} right={header}>
        <div style={{
          background: C.bg2, borderRadius: 14, padding: "10px 14px", marginBottom: 16,
          display: "flex", justifyContent: "space-between", border: `1px solid ${C.felt}`,
          fontWeight: 700, color: C.mut, fontSize: 14,
        }}>
          <span>🂠 {cards} {cards === 1 ? "carta" : "cartes"}</span>
          {g.startedAt && <span>⏱ {fmtClock(Date.now() - g.startedAt)}</span>}
          <span>Reparteix: <b style={{ color: C.goldSoft }}>{dealer?.name}</b></span>
        </div>

        {g.phase === "bets" && (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
              <Avatar profile={cur} size={54} />
              <div>
                <div style={{ fontFamily: font.display, fontSize: 22 }}>{cur?.name}</div>
                <div style={{ color: C.mut, fontWeight: 700, fontSize: 13 }}>
                  Quantes n'apostes?{isLastBettor && " (últim a apostar)"}
                </div>
              </div>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginTop: 14 }}>
              {Array.from({ length: cards + 1 }, (_, n) => (
                <NumCard key={n} n={n}
                  forbidden={isLastBettor && n === forbiddenN}
                  onClick={() => placeBet(n)} />
              ))}
            </div>
            {isLastBettor && forbiddenN >= 0 && forbiddenN <= cards && (
              <p style={{ color: C.goldSoft, fontWeight: 700, fontSize: 13, marginTop: 14 }}>
                ✕ No pot apostar {forbiddenN}: la suma no pot quadrar amb les {cards} {cards === 1 ? "carta" : "cartes"}.
              </p>
            )}
            {g.turn > 0 && (
              <div style={{ marginTop: 20, display: "grid", gap: 6 }}>
                {betOrder.slice(0, g.turn).map((id) => (
                  <div key={id} style={{ display: "flex", gap: 8, color: C.mut, fontWeight: 700, fontSize: 14 }}>
                    <span style={{ flex: 1 }}>{byId(id)?.name}</span>
                    <span style={{ color: C.cream }}>aposta {g.bets[id]}</span>
                  </div>
                ))}
                <button onClick={() => {
                  const prev = betOrder[g.turn - 1];
                  const bets = { ...g.bets };
                  delete bets[prev];
                  setGame({ ...g, bets, turn: g.turn - 1 });
                }} style={{
                  marginTop: 8, padding: "10px 14px", borderRadius: 12, justifySelf: "start",
                  border: `1.5px solid ${C.mut}`, background: "none", color: C.cream,
                  fontWeight: 800, fontSize: 13, cursor: "pointer",
                }}>↩ Desfer l'aposta de {byId(betOrder[g.turn - 1])?.name}</button>
              </div>
            )}
          </>
        )}

        {g.phase === "play" && (
          <div style={{ textAlign: "center", marginTop: 30 }}>
            <div style={{ fontSize: 50 }}>🎴</div>
            <h2 style={{ fontFamily: font.display, color: C.cream }}>Jugueu la ronda!</h2>
            <div style={{ display: "grid", gap: 6, margin: "16px 0 26px" }}>
              {betOrder.map((id) => (
                <div key={id} style={{ color: C.mut, fontWeight: 700 }}>
                  {byId(id)?.name} → aposta <b style={{ color: C.goldSoft }}>{g.bets[id]}</b>
                </div>
              ))}
            </div>
            <BigBtn accent onClick={startResults}>Ja hem acabat — apuntar resultats</BigBtn>
            <button onClick={() => {
              const last = betOrder[N - 1];
              const bets = { ...g.bets };
              delete bets[last];
              setGame({ ...g, bets, phase: "bets", turn: N - 1 });
            }} style={{
              marginTop: 14, padding: "10px 16px", borderRadius: 12,
              border: `1.5px solid ${C.mut}`, background: "none", color: C.cream,
              fontWeight: 800, fontSize: 13, cursor: "pointer",
            }}>↩ Corregir apostes</button>
          </div>
        )}

        {g.phase === "results" && (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
              <Avatar profile={cur} size={54} />
              <div>
                <div style={{ fontFamily: font.display, fontSize: 22 }}>{cur?.name}</div>
                <div style={{ color: C.mut, fontWeight: 700, fontSize: 13 }}>
                  Apostava {g.bets[currentId]} — ha encertat?
                </div>
              </div>
            </div>
            {missFor !== currentId ? (
              <>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 16 }}>
                  <button
                    onClick={() => applyResult(currentId, 10 + 3 * g.bets[currentId], true)}
                    style={{
                      padding: "20px 0", borderRadius: 14, border: "none", background: "#3E7A4E",
                      color: C.cream, fontFamily: font.display, fontSize: 20, cursor: "pointer",
                      boxShadow: "0 3px 0 rgba(0,0,0,.35)",
                    }}>
                    Sí ✓<div style={{ fontSize: 13, fontFamily: font.body, fontWeight: 800 }}>+{10 + 3 * g.bets[currentId]} punts</div>
                  </button>
                  <button
                    onClick={() => setMissFor(currentId)}
                    style={{
                      padding: "20px 0", borderRadius: 14, border: "none", background: C.red,
                      color: C.cream, fontFamily: font.display, fontSize: 20, cursor: "pointer",
                      boxShadow: "0 3px 0 rgba(0,0,0,.35)",
                    }}>
                    No ✕
                  </button>
                </div>
                {g.turn > 0 && (
                  <button onClick={undoResult} style={{
                    marginTop: 16, padding: "10px 14px", borderRadius: 12,
                    border: `1.5px solid ${C.mut}`, background: "none", color: C.cream,
                    fontWeight: 800, fontSize: 13, cursor: "pointer",
                  }}>↩ Desfer el resultat de {byId(betOrder[g.turn - 1])?.name}</button>
                )}
              </>
            ) : (
              <>
                <p style={{ color: C.goldSoft, fontWeight: 700, marginTop: 16 }}>De quantes ha fallat?</p>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
                  {Array.from({ length: cards }, (_, i) => i + 1).map((n) => (
                    <NumCard key={n} n={`−${3 * n}`} onClick={() => applyResult(currentId, -3 * n, false)} />
                  ))}
                </div>
                <p style={{ color: C.mut, fontSize: 12, marginTop: 10 }}>Cada errada resta 3 punts.</p>
                <button onClick={() => setMissFor(null)} style={{
                  marginTop: 8, padding: "10px 14px", borderRadius: 12,
                  border: `1.5px solid ${C.mut}`, background: "none", color: C.cream,
                  fontWeight: 800, fontSize: 13, cursor: "pointer",
                }}>↩ Tornar (sí que ha encertat)</button>
              </>
            )}
          </>
        )}

        {/* Ronda màxima acabada: una altra dona? */}
        {g.phase === "askRepeat" && (
          <div style={{
            position: "fixed", inset: 0, background: "rgba(0,0,0,.75)",
            display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 12,
          }}>
            <div style={{
              background: C.cream, color: C.ink, borderRadius: 18, padding: 22, width: "100%", maxWidth: 360,
              textAlign: "center",
            }}>
              <div style={{ fontSize: 40 }}>🂠</div>
              <h2 style={{ fontFamily: font.display, margin: "6px 0 8px" }}>Ronda de {cards} acabada!</h2>
              <p style={{ fontWeight: 700, color: "#6B5F4E", margin: "0 0 16px", fontSize: 14 }}>
                Voleu fer una altra dona amb {cards} cartes, o comencem a baixar?
              </p>
              <div style={{ display: "grid", gap: 10 }}>
                <button onClick={() => {
                  const seq = [...g.seq];
                  seq.splice(g.round + 1, 0, cards);
                  setGame({ ...g, seq, round: g.round + 1, phase: "bets", bets: {}, turn: 0 });
                }} style={{
                  padding: 14, borderRadius: 12, border: "none", background: C.red,
                  color: C.cream, fontFamily: font.display, fontSize: 15, cursor: "pointer",
                }}>Sí, una altra amb {cards}!</button>
                <button onClick={() => {
                  setGame({ ...g, round: g.round + 1, phase: "bets", bets: {}, turn: 0 });
                }} style={{
                  padding: 14, borderRadius: 12, border: `2px solid ${C.ink}`, background: "none",
                  color: C.ink, fontWeight: 800, cursor: "pointer",
                }}>No, comencem a baixar</button>
              </div>
            </div>
          </div>
        )}

        {/* Alerta: tots han "encertat" — impossible */}
        {liarAlert && (
          <div style={{
            position: "fixed", inset: 0, background: "rgba(0,0,0,.75)",
            display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 12,
          }}>
            <div style={{
              background: C.cream, color: C.ink, borderRadius: 18, padding: 22, width: "100%", maxWidth: 360,
              textAlign: "center", border: `3px solid ${C.red}`,
            }}>
              <div style={{ fontSize: 44 }}>🤥</div>
              <h2 style={{ fontFamily: font.display, margin: "6px 0 8px", color: C.red }}>Algú ha mentit!</h2>
              <p style={{ fontWeight: 700, color: "#6B5F4E", margin: "0 0 16px", fontSize: 14 }}>
                No podeu encertar tots: la suma d'apostes mai quadra amb les bases de la ronda.
                Reviseu qui ha guanyat de veritat i torneu a indicar els resultats.
              </p>
              <button onClick={() => setLiarAlert(false)} style={{
                width: "100%", padding: 12, borderRadius: 12, border: "none",
                background: C.red, color: C.cream, fontFamily: font.display, fontSize: 15, cursor: "pointer",
              }}>Tornar a indicar</button>
            </div>
          </div>
        )}

        {confirmEnd && (
          <div onClick={() => setConfirmEnd(false)} style={{
            position: "fixed", inset: 0, background: "rgba(0,0,0,.7)",
            display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 11,
          }}>
            <div onClick={(e) => e.stopPropagation()} style={{
              background: C.cream, color: C.ink, borderRadius: 18, padding: 20, width: "100%", maxWidth: 360,
              textAlign: "center",
            }}>
              <h2 style={{ fontFamily: font.display, margin: "0 0 8px" }}>Finalitzar partida?</h2>
              <p style={{ fontWeight: 700, color: "#6B5F4E", margin: "0 0 16px", fontSize: 14 }}>
                Es guardarà amb la puntuació tal com està ara (ronda {g.round + 1} de {g.seq.length}).
              </p>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <button onClick={() => setConfirmEnd(false)} style={{
                  padding: 12, borderRadius: 12, border: `2px solid ${C.ink}`, background: "none",
                  color: C.ink, fontWeight: 800, cursor: "pointer",
                }}>Continuar jugant</button>
                <button onClick={() => {
                  setConfirmEnd(false);
                  finishGame({ ...g });
                }} style={{
                  padding: 12, borderRadius: 12, border: "none", background: C.red,
                  color: C.cream, fontWeight: 800, cursor: "pointer",
                }}>Finalitzar</button>
              </div>
            </div>
          </div>
        )}

        {showRank && (
          <div onClick={() => setShowRank(false)} style={{
            position: "fixed", inset: 0, background: "rgba(0,0,0,.7)",
            display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 10,
          }}>
            <div onClick={(e) => e.stopPropagation()} style={{
              background: C.cream, color: C.ink, borderRadius: 18, padding: 20, width: "100%", maxWidth: 380,
            }}>
              <h2 style={{ fontFamily: font.display, margin: "0 0 14px", textAlign: "center" }}>Classificació</h2>
              <div style={{ display: "grid", gap: 10 }}>
                {ranking.map((id, i) => (
                  <div key={id} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span style={{ fontFamily: font.display, width: 22, color: i === 0 ? C.gold : C.ink }}>{i + 1}</span>
                    <Avatar profile={byId(id)} size={38} ring={i === 0 ? C.gold : C.ink} />
                    <span style={{ fontWeight: 800, flex: 1 }}>{byId(id)?.name}</span>
                    <span style={{ fontFamily: font.display, fontSize: 20, color: g.scores[id] < 0 ? C.red : C.ink }}>
                      {g.scores[id]}
                    </span>
                  </div>
                ))}
              </div>
              <button onClick={() => setShowRank(false)} style={{
                marginTop: 16, width: "100%", padding: 12, borderRadius: 12, border: "none",
                background: C.ink, color: C.cream, fontWeight: 800, cursor: "pointer",
              }}>Tancar</button>
            </div>
          </div>
        )}
      </Shell>
    );
  }

  if (view === "tiebreak" && g && tiebreak) {
    const [a, b] = tiebreak.queue;
    const pa = byId(a), pb = byId(b);
    const t = tiebreak;
    const flipWinner = t.result ? (t.result === t.choice ? a : b) : null;
    const Coin = () => (
      <div style={{
        width: 150, height: 150, borderRadius: "50%", margin: "20px auto",
        background: `radial-gradient(circle at 35% 30%, ${C.goldSoft}, ${C.gold} 55%, #A87A2A)`,
        border: "5px solid #8a6420", display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center",
        fontFamily: font.display, color: "#5C430F",
        animation: t.flipping ? "coinspin 0.3s linear infinite" : "none",
        boxShadow: "0 6px 0 rgba(0,0,0,.4)",
      }}>
        {t.flipping ? (
          <span style={{ fontSize: 54 }}>?</span>
        ) : t.result ? (
          <>
            <span style={{ fontSize: 40 }}>{t.result === "cara" ? "👑" : "✚"}</span>
            <span style={{ fontSize: 18 }}>{t.result.toUpperCase()}</span>
          </>
        ) : (
          <span style={{ fontSize: 40 }}>🪙</span>
        )}
      </div>
    );
    return (
      <Shell title="Desempat!">
        <p style={{ color: C.goldSoft, fontWeight: 800, textAlign: "center", fontSize: 16, margin: "4px 0 0" }}>
          {pa?.name} i {pb?.name} han empatat amb {g.scores[a]} punts
        </p>
        <div style={{ display: "flex", justifyContent: "center", gap: 30, margin: "18px 0 6px" }}>
          <div style={{ textAlign: "center" }}>
            <Avatar profile={pa} size={64} />
            <div style={{ fontWeight: 800, marginTop: 4 }}>{pa?.name}</div>
          </div>
          <div style={{ alignSelf: "center", fontFamily: font.display, color: C.mut }}>vs</div>
          <div style={{ textAlign: "center" }}>
            <Avatar profile={pb} size={64} />
            <div style={{ fontWeight: 800, marginTop: 4 }}>{pb?.name}</div>
          </div>
        </div>
        <Coin />
        {!t.choice && (
          <>
            <p style={{ color: C.cream, fontWeight: 800, textAlign: "center" }}>
              {pa?.name}, tria:
            </p>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              {["cara", "creu"].map((c) => (
                <button key={c} onClick={() => {
                  setTiebreak({ ...t, choice: c, flipping: true });
                  setTimeout(() => {
                    const result = Math.random() < 0.5 ? "cara" : "creu";
                    setTiebreak((prev) => ({ ...prev, flipping: false, result }));
                  }, 2200);
                }} style={{
                  padding: "16px 0", borderRadius: 14, border: "none", background: C.cream,
                  color: C.ink, fontFamily: font.display, fontSize: 18, cursor: "pointer",
                  boxShadow: "0 3px 0 rgba(0,0,0,.35)",
                }}>{c === "cara" ? "👑 Cara" : "✚ Creu"}</button>
              ))}
            </div>
            <p style={{ color: C.mut, fontWeight: 700, fontSize: 13, textAlign: "center", marginTop: 10 }}>
              {pb?.name} es queda amb l'altra opció
            </p>
          </>
        )}
        {t.choice && t.flipping && (
          <p style={{ color: C.goldSoft, fontWeight: 800, textAlign: "center", fontSize: 16 }}>
            {pa?.name} ha triat {t.choice}... la moneda gira!
          </p>
        )}
        {t.result && (
          <div style={{ textAlign: "center" }}>
            <h2 style={{ fontFamily: font.display, color: C.gold, fontSize: 24, margin: "6px 0 14px" }}>
              Ha sortit {t.result}! Guanya {byId(flipWinner)?.name} 🎉
            </h2>
            <BigBtn accent onClick={() => {
              const queue = [flipWinner, ...t.queue.slice(2)];
              if (queue.length === 1) {
                setGame({ ...g, tbWinner: flipWinner });
                setTiebreak(null);
                setView("finish");
              } else {
                setTiebreak({ queue, choice: null, flipping: false, result: null });
              }
            }}>Continuar</BigBtn>
          </div>
        )}
      </Shell>
    );
  }

  if (view === "finish" && g) {
    const winnerId = g.tbWinner || ranking[0];
    const winner = byId(winnerId);
    const loser = byId(ranking[ranking.length - 1]);
    return (
      <Shell title="Final de partida">
        <div style={{ textAlign: "center" }}>
          <h2 style={{ fontFamily: font.display, color: C.gold, fontSize: 26, margin: "4px 0" }}>
            🏆 {winner?.name} guanya amb {g.scores[winnerId]} punts!
          </h2>
          {g.tbWinner && (
            <p style={{ color: C.goldSoft, fontWeight: 700, fontSize: 13, margin: "0 0 4px" }}>
              🪙 Victòria per desempat a cara o creu
            </p>
          )}
          <p style={{ color: C.mut, fontWeight: 700 }}>
            💀 {loser?.name} queda últim amb {g.scores[ranking[ranking.length - 1]]}.
          </p>
        </div>
        <div style={{ display: "flex", justifyContent: "center", gap: 24, margin: "24px 0" }}>
          {[
            { mode: "winner", label: "Foto del 🥇", photo: finWinner },
            { mode: "loser", label: "Foto del 💀", photo: finLoser },
          ].map(({ mode, label, photo }) => (
            <div key={mode}>
              <p style={{ textAlign: "center", color: C.goldSoft, fontWeight: 800, margin: "0 0 8px" }}>{label}</p>
              <button onClick={() => setCamFor(mode)} style={{
                width: 140, height: 140, borderRadius: 18, padding: 0, overflow: "hidden",
                border: `2px dashed ${photo ? C.gold : C.mut}`, background: C.bg2, cursor: "pointer",
              }}>
                {photo ? (
                  <img src={photo} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                ) : (
                  <span style={{ color: C.mut, fontWeight: 700, fontSize: 13 }}>
                    📷<br />{mode === "winner" ? "Amb corona 👑" : "Amb llàgrimes 💧"}
                  </span>
                )}
              </button>
            </div>
          ))}
        </div>
        {camFor && (
          <FilterCam
            mode={camFor}
            onClose={() => setCamFor(null)}
            onDone={(ph) => {
              if (camFor === "winner") setFinWinner(ph); else setFinLoser(ph);
              setCamFor(null);
            }}
          />
        )}
        <button onClick={() => { setDetailPl(g.playerIds[0]); setShowRounds(true); }} style={{
          width: "100%", padding: "12px 0", borderRadius: 12, marginBottom: 14,
          border: `1.5px solid ${C.gold}`, background: "none", color: C.goldSoft,
          fontWeight: 800, fontSize: 14, cursor: "pointer",
        }}>📖 Detall per rondes</button>
        {showRounds && (
          <div onClick={() => setShowRounds(false)} style={{
            position: "fixed", inset: 0, background: "rgba(0,0,0,.7)",
            display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 10,
          }}>
            <div onClick={(e) => e.stopPropagation()} style={{
              background: C.cream, color: C.ink, borderRadius: 18, padding: 18, width: "100%", maxWidth: 380,
              maxHeight: "82vh", overflowY: "auto",
            }}>
              <h2 style={{ fontFamily: font.display, margin: "0 0 12px", textAlign: "center" }}>Detall per rondes</h2>
              <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 8, marginBottom: 10 }}>
                {g.playerIds.map((id) => (
                  <button key={id} onClick={() => setDetailPl(id)} style={{
                    display: "flex", alignItems: "center", gap: 6, padding: "6px 12px 6px 6px",
                    borderRadius: 999, whiteSpace: "nowrap", cursor: "pointer",
                    border: `2px solid ${detailPl === id ? C.gold : "#D8C9B4"}`,
                    background: detailPl === id ? "#F3E3BF" : "none", color: C.ink, fontWeight: 800,
                  }}>
                    <Avatar profile={byId(id)} size={26} ring={detailPl === id ? C.gold : "#D8C9B4"} />
                    {byId(id)?.name}
                  </button>
                ))}
              </div>
              {(() => {
                const hist = g.history || [];
                const rows = hist.map((h, i) => ({ i, cards: h.cards, e: h.entries.find((x) => x.id === detailPl) }))
                  .filter((r) => r.e);
                const hits = rows.filter((r) => r.e.hit).length;
                const miss = rows.length - hits;
                return (
                  <>
                    <p style={{ textAlign: "center", fontWeight: 800, margin: "0 0 10px", color: "#6B5F4E", fontSize: 14 }}>
                      ✓ {hits} encerts · ✕ {miss} errades
                    </p>
                    {rows.length === 0 && (
                      <p style={{ textAlign: "center", color: "#6B5F4E", fontWeight: 700 }}>Encara no hi ha rondes completades.</p>
                    )}
                    <div style={{ display: "grid", gap: 6 }}>
                      {rows.map(({ i, cards: cds, e }) => (
                        <div key={i} style={{
                          display: "flex", alignItems: "center", gap: 8, padding: "8px 10px",
                          background: e.hit ? "#E4EFDD" : "#F5DDD8", borderRadius: 10,
                          fontWeight: 700, fontSize: 14,
                        }}>
                          <span style={{ fontFamily: font.display, width: 38 }}>R{i + 1}</span>
                          <span style={{ flex: 1, color: "#6B5F4E" }}>{cds} 🂠 · aposta {e.bet}</span>
                          <span style={{
                            fontFamily: font.display, fontSize: 16,
                            color: e.hit ? "#3E7A4E" : C.red,
                          }}>{e.hit ? `✓ +${e.delta}` : `✕ ${e.delta}`}</span>
                        </div>
                      ))}
                    </div>
                  </>
                );
              })()}
              <button onClick={() => setShowRounds(false)} style={{
                marginTop: 14, width: "100%", padding: 12, borderRadius: 12, border: "none",
                background: C.ink, color: C.cream, fontWeight: 800, cursor: "pointer",
              }}>Tancar</button>
            </div>
          </div>
        )}
        <BigBtn accent onClick={saveGame}>Guardar partida</BigBtn>
        <p style={{ color: C.mut, fontSize: 12, textAlign: "center", marginTop: 12 }}>
          Les fotos són opcionals — pots guardar sense.
        </p>
      </Shell>
    );
  }

  if (view === "history") {
    const detail = gameDetail ? games.find((x) => x.id === gameDetail) : null;
    return (
      <Shell title="Partides anteriors" back={() => setView("home")}>
        {games.length === 0 && (
          <p style={{ color: C.mut, textAlign: "center", marginTop: 30 }}>
            Encara no hi ha cap partida guardada. Juga la primera!
          </p>
        )}
        <div style={{ display: "grid", gap: 14 }}>
          {games.map((gm) => {
            const w = byId(gm.winnerId), l = byId(gm.loserId);
            const wPts = gm.players.find((p) => p.profileId === gm.winnerId)?.points;
            const lPts = gm.players.find((p) => p.profileId === gm.loserId)?.points;
            const Pod = ({ photo, profile, label, pts, gold }) => {
              const img = photo || profile?.photo;
              return (
                <div style={{ textAlign: "center", flex: 1 }}>
                  <button onClick={() => img && setLightbox(img)} style={{
                    width: 84, height: 84, borderRadius: 14, overflow: "hidden", padding: 0,
                    border: `2.5px solid ${gold ? C.gold : C.red}`, background: C.felt,
                    display: "flex", alignItems: "center", justifyContent: "center",
                    margin: "0 auto", cursor: img ? "pointer" : "default",
                  }}>
                    {photo ? <img src={photo} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                      : <Avatar profile={profile} size={60} ring="transparent" />}
                  </button>
                  <div style={{ fontWeight: 800, marginTop: 6 }}>{label} {profile?.name}</div>
                  <div style={{ color: C.mut, fontWeight: 700, fontSize: 13 }}>{pts} punts</div>
                </div>
              );
            };
            return (
              <div key={gm.id} style={{ background: C.bg2, borderRadius: 16, padding: 14, border: `1px solid ${C.felt}` }}>
                <div style={{ display: "flex", alignItems: "center", marginBottom: 10 }}>
                  <span style={{ color: C.mut, fontWeight: 700, fontSize: 13, flex: 1 }}>
                    {fmtDate(gm.date)} · {gm.players.length} jugadors{fmtDur(gm.durationMs) ? ` · ⏱ ${fmtDur(gm.durationMs)}` : ""}
                  </span>
                  <button onClick={() => setConfirmDel(gm.id)} style={{
                    background: "none", border: `1.5px solid ${C.red}`, color: "#E07B72",
                    borderRadius: 10, padding: "6px 10px", fontSize: 14, cursor: "pointer",
                  }}>🗑</button>
                </div>
                <div style={{ display: "flex", gap: 12 }}>
                  <Pod photo={gm.winnerPhoto} profile={w} label="🥇" pts={wPts} gold />
                  <Pod photo={gm.loserPhoto} profile={l} label="💀" pts={lPts} />
                </div>
                <button onClick={() => setGameDetail(gm.id)} style={{
                  marginTop: 12, width: "100%", padding: "10px 0", borderRadius: 12,
                  border: `1.5px solid ${C.gold}`, background: "none", color: C.goldSoft,
                  fontWeight: 800, fontSize: 14, cursor: "pointer",
                }}>📊 Puntuació completa</button>
              </div>
            );
          })}
        </div>

        {/* Puntuació completa d'una partida */}
        {detail && (
          <div onClick={() => setGameDetail(null)} style={{
            position: "fixed", inset: 0, background: "rgba(0,0,0,.7)",
            display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 10,
          }}>
            <div onClick={(e) => e.stopPropagation()} style={{
              background: C.cream, color: C.ink, borderRadius: 18, padding: 20, width: "100%", maxWidth: 380,
              maxHeight: "80vh", overflowY: "auto",
            }}>
              <h2 style={{ fontFamily: font.display, margin: "0 0 4px", textAlign: "center" }}>Classificació</h2>
              <p style={{ textAlign: "center", color: "#6B5F4E", fontWeight: 700, fontSize: 13, margin: "0 0 14px" }}>
                {fmtDate(detail.date)}
              </p>
              <div style={{ display: "grid", gap: 10 }}>
                {[...detail.players].sort((a, b) => b.points - a.points).map((pl, i) => (
                  <div key={pl.profileId} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span style={{ fontFamily: font.display, width: 22, color: i === 0 ? C.gold : C.ink }}>{i + 1}</span>
                    <Avatar profile={byId(pl.profileId)} size={38} ring={i === 0 ? C.gold : C.ink} />
                    <span style={{ fontWeight: 800, flex: 1 }}>{byId(pl.profileId)?.name || "?"}</span>
                    <span style={{ fontFamily: font.display, fontSize: 20, color: pl.points < 0 ? C.red : C.ink }}>
                      {pl.points}
                    </span>
                  </div>
                ))}
              </div>
              <button onClick={() => setGameDetail(null)} style={{
                marginTop: 16, width: "100%", padding: 12, borderRadius: 12, border: "none",
                background: C.ink, color: C.cream, fontWeight: 800, cursor: "pointer",
              }}>Tancar</button>
            </div>
          </div>
        )}

        {/* Confirmació d'eliminar partida */}
        {confirmDel && (
          <div onClick={() => setConfirmDel(null)} style={{
            position: "fixed", inset: 0, background: "rgba(0,0,0,.7)",
            display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 11,
          }}>
            <div onClick={(e) => e.stopPropagation()} style={{
              background: C.cream, color: C.ink, borderRadius: 18, padding: 20, width: "100%", maxWidth: 340,
              textAlign: "center",
            }}>
              <h2 style={{ fontFamily: font.display, margin: "0 0 8px" }}>Eliminar partida?</h2>
              <p style={{ fontWeight: 700, color: "#6B5F4E", margin: "0 0 16px", fontSize: 14 }}>
                S'esborrarà del tot i les estadístiques dels perfils es recalcularan sense aquesta partida.
              </p>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <button onClick={() => setConfirmDel(null)} style={{
                  padding: 12, borderRadius: 12, border: `2px solid ${C.ink}`, background: "none",
                  color: C.ink, fontWeight: 800, cursor: "pointer",
                }}>Cancel·lar</button>
                <button onClick={() => {
                  setGames(games.filter((x) => x.id !== confirmDel));
                  setConfirmDel(null);
                }} style={{
                  padding: 12, borderRadius: 12, border: "none", background: C.red,
                  color: C.cream, fontWeight: 800, cursor: "pointer",
                }}>Eliminar</button>
              </div>
            </div>
          </div>
        )}

        <Lightbox src={lightbox} onClose={() => setLightbox(null)} />
      </Shell>
    );
  }

  return null;
}

/* Registre del service worker (perquè funcioni offline) */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

ReactDOM.createRoot(document.getElementById("root")).render(<LaPodrida />);
</script>
</body>
</html>
